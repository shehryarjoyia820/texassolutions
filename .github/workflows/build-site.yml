name: Build site (blog posts)

# Rebuilds every page when a blog post is added or edited (for example from
# /admin/), then commits the generated HTML so GitHub Pages publishes it.
on:
  push:
    branches: [Main]
    paths:
      - "content/**"
      - "assets/blog/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install markdown pyyaml pillow

      - name: Build pages
        run: python tools/site.py

      - name: Commit generated pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish blog changes"
          git pull --rebase
          git push

      - name: SEO audit (informational)
        continue-on-error: true
        run: python tools/audit.py

      - name: Notify Bing and Yandex (IndexNow)
        run: |
          python - <<'PY'
          import json, urllib.request
          urls = open("urls.txt").read().split()
          body = json.dumps({"host": "dispatch.texassolutions.co", "key": "7c1f4e2a9b8d4c6e8f0a1b2c3d4e5f60",
                             "keyLocation": "https://dispatch.texassolutions.co/7c1f4e2a9b8d4c6e8f0a1b2c3d4e5f60.txt", "urlList": urls}).encode()
          for ep in ("https://api.indexnow.org/indexnow", "https://yandex.com/indexnow"):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json"}), timeout=30)
                  print(ep, len(urls), r.status)
              except Exception as e:
                  print(ep, "failed", e)
          PY
