name: Update diesel prices

# EIA publishes weekly diesel prices on Monday afternoons (Tuesday after a
# holiday). Check daily; commit only when the numbers change.
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch EIA diesel prices
        run: python tools/fuel_prices.py

      - name: Rebuild pages
        run: python tools/site.py

      - name: Commit if prices changed
        id: commit
        run: |
          if git diff --quiet -- data/diesel-prices.json; then
            echo "No new diesel prices."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update weekly diesel prices"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify Bing and Yandex (IndexNow)
        if: steps.commit.outputs.changed == 'true'
        run: |
          body='{"host":"dispatch.texassolutions.co","key":"7c1f4e2a9b8d4c6e8f0a1b2c3d4e5f60","keyLocation":"https://dispatch.texassolutions.co/7c1f4e2a9b8d4c6e8f0a1b2c3d4e5f60.txt","urlList":["https://dispatch.texassolutions.co/truck-fuel-cost-calculator.html"]}'
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -H "Content-Type: application/json" -d "$body" https://api.indexnow.org/indexnow || true
