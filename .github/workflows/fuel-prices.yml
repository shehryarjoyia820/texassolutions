name: Update diesel prices (daily)

# Daily state diesel and gasoline averages (AAA) refresh overnight; EIA weekly on Mondays.
# Writes data/fuel-prices.json (see tools/fuel_prices.py); stale values keep their real dates.
# Runs every morning and midday (US Eastern); commits only when prices change.
on:
  schedule:
    - cron: "15 11 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuel-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install markdown pyyaml pillow

      - name: Fetch fuel prices (AAA daily, EIA weekly)
        run: python tools/fuel_prices.py

      - name: Rebuild pages
        run: python tools/site.py

      - name: Commit if prices changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/fuel-prices.json)" ]; then
            echo "No new fuel prices."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update daily diesel prices"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify Bing and Yandex (IndexNow)
        if: steps.commit.outputs.changed == 'true'
        run: |
          body='{"host":"dispatch.texassolutions.co","key":"7c1f4e2a9b8d4c6e8f0a1b2c3d4e5f60","keyLocation":"https://dispatch.texassolutions.co/7c1f4e2a9b8d4c6e8f0a1b2c3d4e5f60.txt","urlList":["https://dispatch.texassolutions.co/truck-fuel-cost-calculator.html"]}'
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -H "Content-Type: application/json" -d "$body" https://api.indexnow.org/indexnow || true
